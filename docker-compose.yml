services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      NOEVRA_APP_ROOT: /app
      NOEVRA_DATA_DIR: /app/data
      # Override a host .env's relative database path inside the container.
      DATABASE_URL: ${NOEVRA_DOCKER_DATABASE_URL:-sqlite+aiosqlite:////app/data/research_assistant.db}
    volumes:
      - noevra-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  noevra-data:
