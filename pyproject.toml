[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noevra"
version = "2.0.0"
dynamic = ["dependencies"]
description = "Noevra — Multi-Agent Research Assistant with LangGraph orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["research", "langgraph", "multi-agent", "ai", "assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
noevra = "src.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["static/**/*"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.23.0", "pytest-cov>=5.0.0", "pypdf>=6,<7", "ruff>=0.14,<1"]
legacy = ["streamlit==1.57.0"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["venv", ".venv", ".agents", "frontend", "generate_reports.py"]

[tool.ruff.lint]
select = ["F", "E9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
]
